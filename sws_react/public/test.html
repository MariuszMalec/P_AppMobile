<!doctype html><meta name="viewport" content="width=device-width">
<body style="font:18px sans-serif;padding:16px"><pre id="o">test...</pre>
<script>
const o = document.getElementById('o')
const URL = 'http://127.0.0.1:8001/api/teams'
async function run(i) {
  const t0 = performance.now()
  const r = await fetch(URL)
  const t1 = performance.now()
  const d = await r.json()
  const t2 = performance.now()
  o.textContent += `\n#${i}: odpowiedz ${Math.round(t1-t0)} ms, JSON ${Math.round(t2-t1)} ms, rekordow ${d.length}`
}
;(async () => { for (let i = 1; i <= 3; i++) await run(i) })()
.catch(e => o.textContent += '\nBLAD: ' + e.message)
</script>
