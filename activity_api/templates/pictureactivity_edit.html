<style>
    body {
        font-family: Arial, sans-serif;
        padding: 16px;
        background: #f4f6f8;

    form {
        background: white;
        padding: 16px;
        border-radius: 12px;
        max-width: 420px;
        margin: auto;
    }
    label {
        font-weight: bold;
        display: block;
        margin-top: 12px;
    }
    select, input {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }
    button {
        margin-top: 16px;
        width: 100%;
        padding: 12px;
        border-radius: 14px;
        border: none;
        font-size: 1em;
        font-weight: bold;
        background: #22c55e;
        cursor: pointer;
    }
    img {
        margin-top: 12px;
        max-width: 100%;
        border-radius: 8px;
    }
    .cancel {
        margin-top: 8px;
        background: #e5e7eb;
    }

    /* PRZYCISK USUŃ */
    .delete {
        margin-top: 8px;
        background: #ef4444;
        color: white;
    }

    .delete:hover {
        background: #dc2626;
    }

    select:disabled {
        background: #e5e7eb;
        color: #6b7280;
        cursor: not-allowed;
    }

</style>
```

</head>

<body>

<h2 style="text-align:center">✏️ Edytuj aktywność</h2>

<form method="post">

```
<label>Aktywność</label>

<input
    type="text"
    value="{{ item.name }}"
    readonly
>

<label>URL obrazka</label>
<input type="text" name="picture" value="{{ item.picture or '' }}">

{% if item.picture %}
    <img src="{{ item.picture }}" alt="Podgląd">
{% endif %}

<button type="submit">💾 Zapisz</button>

<button type="button" class="cancel" onclick="history.back()">
    ↩ Powrót bez zmian
</button>

</form>

<!-- OSOBNY FORMULARZ USUWANIA -->

<form
    method="post"
    action="/pictureactivities/delete/{{ item.id }}"
    onsubmit="return confirm('Czy na pewno chcesz usunąć tę aktywność?');"
>
    <button type="submit" class="delete">
        🗑️ Usuń aktywność
    </button>
</form>

</body>
</html>
