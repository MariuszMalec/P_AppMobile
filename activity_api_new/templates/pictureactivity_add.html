<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dodaj aktywność</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 16px;
            background: #f4f6f8;
        }
        form {
            background: white;
            padding: 16px;
            border-radius: 12px;
            max-width: 420px;
            margin: auto;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 16px;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: none;
            font-size: 1em;
            font-weight: bold;
            background: #22c55e;
            cursor: pointer;
        }
        .cancel {
            margin-top: 8px;
            background: #e5e7eb;
        }
        img {
            margin-top: 12px;
            max-width: 100%;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<h2 style="text-align:center">➕ Dodaj aktywność</h2>

{% if errors %}
    <div style="
        background:#fee2e2;
        color:#991b1b;
        padding:12px;
        border-radius:10px;
        margin-bottom:12px;
        font-weight:bold;
    ">
        {% for e in errors %}
            • {{ e }}<br>
        {% endfor %}
    </div>
{% endif %}


<form method="post">

    <label>Typ aktywności</label>
    <select name="activityName">
        {% for k, v in activities.items() %}
            <option value="{{ k }}">{{ v.value }}</option>
        {% endfor %}
    </select>


    <label>Nazwa (STRING)</label>
    <input type="text" name="name" placeholder="np. Sprzątanie łazienki" required>

    <label>URL obrazka</label>
    <input type="text" name="picture" placeholder="https://...">

    <button type="submit">💾 Zapisz</button>

    <button type="button" class="cancel" onclick="history.back()">
        ↩ Powrót bez zmian
    </button>

</form>

</body>
</html>
