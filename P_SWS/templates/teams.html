<!DOCTYPE html>
<html>
<head>
    <title>Teams</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
</head>
<body class="container mt-4">

<h1 class="mb-4">🏟️ Teams</h1>

<a href="/ui/trophies" class="btn btn-secondary mb-3">View Trophies</a>

<table class="table table-striped table-bordered">
  <thead class="table-dark">
  <tr>
    <th>Name</th>
    <th>Season</th>
    <th>Final Result</th>
    <th>Trophy Win</th>
    <th>Trophy</th>
  </tr>
</thead>
<tbody>
{% for t in teams %}
<tr>
  <td>{{ t["Name"] }}</td>
  <td>{{ t["Season"] }}</td>
  <td>{{ t["FinalResult"] }}</td>
  <td>{{ t["TrophyWin"] or "—" }}</td>
  <td class="text-center">
    {% if t["TrophyPicture"] %}
      <img
        src="{{ t['TrophyPicture'] }}"
        alt="{{ t['TrophyName'] }}"
        title="{{ t['TrophyName'] }}"
        style="height:60px;"
      >
    {% else %}
      —
    {% endif %}
  </td>
</tr>
{% endfor %}
</tbody>
</table>

</body>
</html>
