<!DOCTYPE html>
<html>
<head>
    <title>Trophies</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
</head>
<body class="container mt-4">

<h1 class="mb-4">🏆 Trophies</h1>

<a href="/ui/teams" class="btn btn-secondary mb-3">← Back to Teams</a>

<table class="table table-striped table-bordered">
  <thead class="table-dark">
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Team</th>
      <th>Picture</th>
    </tr>
  </thead>
  <tbody>
  {% for t in trophies %}
  <tr>
    <td>{{ t["Name"] }}</td>
    <td>{{ t["Description"] }}</td>
    <td>{{ t["TeamName"] or "—" }}</td>
    <td>
      {% if t["Picture"] %}
        <img
          src="{{ t['Picture'] }}"
          alt="{{ t['Name'] }}"
          style="height:80px; border-radius:8px;"
        >
      {% endif %}
    </td>
  </tr>
  {% endfor %}
</tbody>
</table>

</body>
</html>
