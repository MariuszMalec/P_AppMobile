plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.example.androidtest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.fastapiandroid'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters "arm64-v8a"
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        pip {
            install "fastapi==0.109.2"
            install "uvicorn==0.42.0"
        }
    }
}
