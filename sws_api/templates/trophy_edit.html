<!DOCTYPE html>
<html>
<head>
    <title>Edit Trophy</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
</head>

<body class="container mt-4">

<h1 class="mb-4">✏️ Edit Trophy</h1>

<a href="/trophies" class="btn btn-secondary mb-3">← Back</a>

<form method="post">

<div class="mb-3">
    <label class="form-label">Name</label>
    <input
        type="text"
        name="Name"
        class="form-control"
        value="{{ trophy['Name'] }}"
    >
</div>

<div class="mb-3">
    <label class="form-label">Description</label>
    <input
        type="text"
        name="Description"
        class="form-control"
        value="{{ trophy['Description'] }}"
        required
    >
</div>

<div class="mb-3">
    <label class="form-label">Picture URL</label>
    <input
        type="text"
        name="Picture"
        class="form-control"
        value="{{ trophy['Picture'] }}"
        required
    >
</div>

<div class="mb-3">
    <label class="form-label">Team</label>
    <select name="TeamModelId" class="form-control">

        <option value="">-- No team --</option>

        {% for team in teams %}
        <option
            value="{{ team['Id'] }}"
            {% if trophy['TeamModelId'] == team['Id'] %}
                selected
            {% endif %}
        >
            {{ team['Name'] }}
        </option>
        {% endfor %}

    </select>
</div>

<button type="submit" class="btn btn-primary">
    💾 Save changes
</button>

</form>

</body>
</html>
