<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Edit Team</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="container mt-4">
    <h1>Edit Team</h1>

    <form method="post" action="/teams/{{ team.Id }}/edit">

    <input type="hidden" name="filter_name" value="{{ filter_name or '' }}">
    <input type="hidden" name="sort" value="{{ sort or '' }}">


      <div class="mb-3">
        <label class="form-label">Name *</label>
        <input name="Name" class="form-control" value="{{ team.Name }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <input name="Description" class="form-control" value="{{ team.Description or '' }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Nationality *</label>
        <input name="NationalityName" class="form-control" value="{{ team.NationalityName or '' }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Season</label>
        <input name="Season" type="number" class="form-control" value="{{ team.Season or '' }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Top Scorer</label>
        <input name="TopScorer" class="form-control" value="{{ team.TopScorer or '' }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Final Result</label>
        <input name="FinalResult" class="form-control" value="{{ team.FinalResult or '' }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Trophy Win</label>
        <input name="TrophyWin" class="form-control" value="{{ team.TrophyWin or '' }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Picture (URL or filename)</label>
        <input name="Picture" class="form-control" value="{{ team.Picture or '' }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Trophy Model ID</label>
        <input name="TrophyModelId" type="number" class="form-control" value="{{ team.TrophyModelId or '' }}">
      </div>

      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="/teams" class="btn btn-secondary">Cancel</a>
    </form>

</body>
</html>
