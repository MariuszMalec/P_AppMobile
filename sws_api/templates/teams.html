<!DOCTYPE html>
<html>
<head>
    <title>Teams</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    >
</head>
<body class="container mt-4">

<h1 class="mb-4">🏟️ Teams</h1>

<a href="/trophies" class="btn btn-secondary mb-3">View Trophies</a>

<a href="/home" class="btn btn-secondary mb-3">Back to home</a>

<table class="table table-striped table-bordered">
  <thead class="table-dark">
  <tr>
    <th>Name</th>
    <th>Season</th>
    <th>Final Result</th>
    <th>Trophy Win</th>
    <th>Trophy</th>
    <th style="width: 160px;">Actions</th>
  </tr>
</thead>
<tbody>
{% for t in teams %}
<tr>
  <td>{{ t["Name"] }}</td>
  <td>{{ t["Season"] }}</td>
  <td>{{ t["FinalResult"] }}</td>
  <td>{{ t["TrophyWin"] or "—" }}</td>
  <td class="text-center">
    {% if t["TrophyPicture"] %}
      <img
        src="{{ t['TrophyPicture'] }}"
        alt="{{ t['TrophyName'] }}"
        title="{{ t['TrophyName'] }}"
        style="height:60px;"
      >
    {% else %}
      —
    {% endif %}
  </td>

  <td data-label="Actions" class="d-flex gap-1 flex-wrap">

    <a href="/teams/{{ t.Id }}/trophies_by_season/"
      class="btn btn-sm d-flex align-items-center gap-2 px-3"
      style="background: linear-gradient(135deg, #f6d365, #fda085);
              color:#5a3e00;
              border:none;"
      title="Trophies by season">

      <i class="bi bi-trophy-fill fs-5"></i>
      <span class="fw-semibold">Trophies</span>
    </a>

  </td>

</tr>
{% endfor %}
</tbody>
</table>

</body>
</html>
