<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teams</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    >

    <style>
      .trophy-link i {
        font-size: 1.4rem;
        color: #ffc107;
        padding: 4px 6px;
        border: 1.5px solid #ffc107;
        border-radius: 6px;
        background-color: rgba(255, 193, 7, 0.1);
        transition: transform 0.15s ease, color 0.15s ease;
      }

      .trophy-link:hover i {
        color: #e0a800;
        transform: scale(1.2);
      }

      tr.team-row {
        cursor: pointer;
      }

      tr.team-row:hover {
        background-color: #f5f5f5;
      }
    </style>
</head>

<body class="container mt-4">

<h1 class="mb-4">🏟️ Teams</h1>

<!-- NAV -->
<a href="/trophies" class="btn btn-secondary mb-3">View Trophies</a>
<a href="/home" class="btn btn-secondary mb-3">Back to home</a>

<!-- TABLE -->
<table class="table table-striped table-bordered">
  <thead class="table-dark">
    <tr>
      <th>Name</th>
      <th>Season</th>
      <th>Final Result</th>
      <th>Trophy Win</th>
      <th>Trophy</th>
      <th style="width:120px;">Actions</th>
    </tr>
  </thead>

  <tbody>
    {% for t in teams %}
    <tr class="team-row" data-id="{{ t.Id }}">
      <td>{{ t["Name"] }}</td>
      <td>{{ t["Season"] }}</td>
      <td>{{ t["FinalResult"] }}</td>
      <td>{{ t["TrophyWin"] or "—" }}</td>

      <!-- TROPHY IMAGE -->
      <td class="text-center">
        {% if t["TrophyPicture"] %}
          <img
            src="{{ t['TrophyPicture'] }}"
            alt="{{ t['TrophyName'] }}"
            title="{{ t['TrophyName'] }}"
            style="height:60px;"
          >
        {% else %}
          —
        {% endif %}
      </td>

      <!-- ACTIONS -->
      <td class="text-center">
        <a href="/teams/{{ t.Id }}/trophies_by_season/"
           class="trophy-link text-decoration-none"
           title="Show trophies by season"
           onclick="event.stopPropagation()">
          <i class="bi bi-trophy-fill"></i>
        </a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<!-- 🖼️ FULLSCREEN IMAGE MODAL -->
<div class="modal fade" id="teamImageModal" tabindex="-1">
  <div class="modal-dialog modal-fullscreen">
    <div class="modal-content bg-dark">

      <div class="modal-header border-0">
        <h5 class="modal-title text-white">Team picture</h5>
        <button type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body d-flex justify-content-center align-items-center p-0">
        <img
          id="team-image-modal"
          style="max-width:100%; max-height:100%; object-fit:contain;"
          alt="Team picture"
        >
      </div>

    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS LOGIC -->
<script>
document.querySelectorAll(".team-row").forEach(row => {
    row.addEventListener("click", async () => {
        const teamId = row.dataset.id;

        try {
            const res = await fetch(`/teams/${teamId}/picture`);
            if (!res.ok) return;

            const data = await res.json();
            if (!data.picture) return;

            const img = document.getElementById("team-image-modal");

            img.src = data.picture.startsWith("http")
                ? data.picture
                : "/static/" + data.picture;

            const modal = new bootstrap.Modal(
                document.getElementById("teamImageModal")
            );
            modal.show();

        } catch (err) {
            console.error("Image load failed", err);
        }
    });
});
</script>

</body>
</html>
