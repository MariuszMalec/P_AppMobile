<!DOCTYPE html>
<html>
<head>
    <title>Teams</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    >

    <style>


.trophy-link i {
  font-size: 1.4rem;           /* trochę większa, wyraźniejsza */
  color: #ffc107;              /* złoty kolor */
  padding: 4px 6px;            /* trochę odstępu wewnątrz */
  border: 1.5px solid #ffc107; /* cienkie złote obramowanie */
  border-radius: 6px;          /* zaokrąglone rogi */
  background-color: rgba(255, 193, 7, 0.1); /* jasne, złote tło z przeźroczystością */
  transition: transform 0.15s ease, color 0.15s ease, background-color 0.15s ease;
  display: inline-block;       /* by padding i border działały dobrze */
}

.trophy-link:hover i {
  color: #e0a800;
  border-color: #e0a800;
  background-color: rgba(224, 168, 0, 0.15);
  transform: scale(1.2);
}



      /* Mała ikonka pucharu w tabeli */
      .trophy-link i {
        font-size: 1.2rem;          /* rozmiar ikonki */
        color: #ffc107;             /* złoty */
        transition: transform .15s ease, color .15s ease;
      }

      .trophy-link:hover i {
        color: #e0a800;             /* ciemniejszy złoty przy hover */
        transform: scale(1.15);     /* lekki efekt powiększenia */
      }
    </style>
</head>

<body class="container mt-4">

<h1 class="mb-4">🏟️ Teams</h1>

<!-- Nawigacja -->
<a href="/trophies" class="btn btn-secondary mb-3">View Trophies</a>
<a href="/home" class="btn btn-secondary mb-3">Back to home</a>

<!-- Tabela drużyn -->
<table class="table table-striped table-bordered">
  <thead class="table-dark">
    <tr>
      <th>Name</th>
      <th>Season</th>
      <th>Final Result</th>
      <th>Trophy Win</th>
      <th>Trophy</th>
      <th style="width: 160px;">Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for t in teams %}
    <tr>
      <td>{{ t["Name"] }}</td>
      <td>{{ t["Season"] }}</td>
      <td>{{ t["FinalResult"] }}</td>
      <td>{{ t["TrophyWin"] or "—" }}</td>

      <!-- Kolumna z obrazkiem trofeum lub "—" -->
      <td class="text-center">
        {% if t["TrophyPicture"] %}
          <img
            src="{{ t['TrophyPicture'] }}"
            alt="{{ t['TrophyName'] }}"
            title="{{ t['TrophyName'] }}"
            style="height:60px;"
          >
        {% else %}
          —
        {% endif %}
      </td>

      <!-- Kolumna z akcjami -->
      <td data-label="Actions" class="d-flex gap-1 flex-wrap align-items-center">

        <!-- Mała ikonka pucharu do Trophies by season -->
        <a href="/teams/{{ t.Id }}/trophies_by_season/"
           title="Show trophies by season"
           class="text-decoration-none trophy-link">
          <i class="bi bi-trophy-fill"></i>
        </a>

      </td>

    </tr>
    {% endfor %}
  </tbody>
</table>

</body>
</html>
