<!DOCTYPE html>
<html>
<head>
    <title>Teams</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    >

    <style>
      .trophy-link i {
        font-size: 1.4rem;
        color: #ffc107;
        padding: 4px 6px;
        border: 1.5px solid #ffc107;
        border-radius: 6px;
        background-color: rgba(255, 193, 7, 0.1);
        transition: transform 0.15s ease, color 0.15s ease, background-color 0.15s ease;
        display: inline-block;
      }

      .trophy-link:hover i {
        color: #e0a800;
        border-color: #e0a800;
        background-color: rgba(224, 168, 0, 0.15);
        transform: scale(1.2);
      }

      tr.team-row {
        cursor: pointer;
      }

      tr.team-row:hover {
        background-color: #f5f5f5;
      }
    </style>
</head>

<body class="container mt-4">

<h1 class="mb-4">🏟️ Teams</h1>

<!-- 🏟️ OBRAZEK DRUŻYNY -->
<div id="team-image-wrapper"
     class="mb-4"
     style="display:none;">

  <h5>Team picture</h5>

  <img
    id="team-image"
    style="
      width:300px;
      height:auto;
      border:3px solid #333;
      background:#f8f9fa;
    "
    alt="Team picture"
  >
</div>


<!-- Nawigacja -->
<a href="/trophies" class="btn btn-secondary mb-3">View Trophies</a>
<a href="/home" class="btn btn-secondary mb-3">Back to home</a>

<!-- TABELA DRUŻYN -->
<table class="table table-striped table-bordered">
  <thead class="table-dark">
    <tr>
      <th>Name</th>
      <th>Season</th>
      <th>Final Result</th>
      <th>Trophy Win</th>
      <th>Trophy</th>
      <th style="width: 160px;">Actions</th>
    </tr>
  </thead>

  <tbody>
    {% for t in teams %}
    <tr class="team-row" data-id="{{ t.Id }}">
      <td>{{ t["Name"] }}</td>
      <td>{{ t["Season"] }}</td>
      <td>{{ t["FinalResult"] }}</td>
      <td>{{ t["TrophyWin"] or "—" }}</td>

      <!-- 🏆 TROPHY PICTURE (Z TABELI TROPHIES – NIETKNIĘTE) -->
      <td class="text-center">
        {% if t["TrophyPicture"] %}
          <img
            src="{{ t['TrophyPicture'] }}"
            alt="{{ t['TrophyName'] }}"
            title="{{ t['TrophyName'] }}"
            style="height:60px;"
          >
        {% else %}
          —
        {% endif %}
      </td>

      <!-- AKCJE -->
      <td class="d-flex gap-1 flex-wrap align-items-center">
        <a href="/teams/{{ t.Id }}/trophies_by_season/"
           title="Show trophies by season"
           class="text-decoration-none trophy-link"
           onclick="event.stopPropagation()">
          <i class="bi bi-trophy-fill"></i>
        </a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<!-- JS: klik w wiersz → pobierz Teams.Picture -->
<script>
document.querySelectorAll(".team-row").forEach(row => {
    row.addEventListener("click", async () => {
        const teamId = row.dataset.id;

        try {
            const res = await fetch(`/teams/${teamId}/picture`);
            if (!res.ok) return;

            const data = await res.json();
            if (!data.picture) return;



            const img = document.getElementById("team-image");
            img.src = "/static/images/Gornik_2000.png";
            img.style.display = "inline-block";
            img.style.width = "300px";
            img.style.border = "5px solid blue";

            


            if (data.picture.startsWith("http")) {
                img.src = data.picture;
            } else {
                img.src = "/static/" + data.picture;
            }
            
            document.getElementById("team-image-wrapper").style.display = "block";


            img.onload = () => console.log("IMAGE LOADED, size:", img.naturalWidth, img.naturalHeight);


        } catch (e) {
            console.error("Failed to load team picture", e);
        }
    });
});
</script>

</body>
</html>
