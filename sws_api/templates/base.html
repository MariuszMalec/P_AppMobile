<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}SWS{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

    {% block head_extra %}{% endblock %}

    <script>
        (function () {
            const theme = localStorage.getItem("sws-theme") || "light";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>

<body>

    <div class="sws-theme-toggle">
        <button
            type="button"
            id="themeToggleBtn"
            class="btn btn-sm btn-outline-secondary"
            onclick="toggleSwsTheme()"
        >
            🌙 Ciemny
        </button>
    </div>

    {% block content %}{% endblock %}

    <script>
        function updateSwsThemeButton() {
            const theme =
                document.documentElement.getAttribute("data-theme");

            const btn =
                document.getElementById("themeToggleBtn");

            if (!btn) return;

            if (theme === "dark") {
                btn.textContent = "☀️ Jasny";
            } else {
                btn.textContent = "🌙 Ciemny";
            }
        }

        function toggleSwsTheme() {
            const current =
                document.documentElement.getAttribute("data-theme");

            const next =
                current === "dark" ? "light" : "dark";

            document.documentElement.setAttribute(
                "data-theme",
                next
            );

            localStorage.setItem(
                "sws-theme",
                next
            );

            updateSwsThemeButton();
        }

        document.addEventListener(
            "DOMContentLoaded",
            updateSwsThemeButton
        );
    </script>

</body>
</html>
