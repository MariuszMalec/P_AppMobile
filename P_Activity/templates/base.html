<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Activity{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: system-ui, Arial, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 14px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            background: rgba(0,0,0,0.4);
        }

        main {
            flex: 1;
            padding: 16px;
        }

        footer {
            padding: 12px;
            background: rgba(0,0,0,0.6);
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-status {
            background: #22c55e;
            color: #022c22;
        }

        .btn-week {
            background: #38bdf8;
            color: #020617;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    ⏱ Activity Status
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <a href="/status" style="flex:1">
        <button class="btn btn-status">LIVE</button>
    </a>

    <a href="/week" style="flex:1">
        <button class="btn btn-week">📅 Tydzień</button>
    </a>
</footer>

</body>
</html>
