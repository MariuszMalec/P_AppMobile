<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Aktywności – obrazki</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #020617;
            color: #e5e7eb;
            margin: 0;
            padding: 16px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* === GRID === */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        /* === CARD === */
        .card {
            position: relative;
            background: #0f172a;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0,0,0,.4);
        }

        .card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
        }

        .card-title {
            padding: 8px 10px;
            font-size: 0.9em;
            font-weight: bold;
            text-align: center;
            background: #020617;
        }

        /* === EDIT BUTTON === */
        .edit-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,.7);
            color: #facc15;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.75em;
            text-decoration: none;
            backdrop-filter: blur(4px);
        }

        .edit-btn:hover {
            background: #facc15;
            color: #020617;
        }

        /* === TOP NAV === */
        .nav {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .nav a {
            flex: 1;
            text-decoration: none;
        }

        .nav button {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: none;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-main {
            background: #38bdf8;
            color: #020617;
        }
    </style>
</head>

<body>

<h1>🖼 Aktywności – obrazki</h1>

<div class="nav">
    <a href="/">
        <button class="btn-main">⬅ Powrót</button>
    </a>
</div>

<div class="grid">
    {% for item in items %}
        <div class="card">

            {% if item.picture %}
                <img src="{{ item.picture }}" alt="{{ item.activityName }}">
            {% endif %}

            <div class="card-title">
                {{ item.activityName }}
            </div>

            <a class="edit-btn" href="/pictureactivities/edit/{{ item.id }}">
                ✏️ Edytuj
            </a>

        </div>
    {% endfor %}
</div>

</body>
</html>
