<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Picture Activities</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }
        .card img {
            max-width: 100%;
            height: 100px;
            object-fit: contain;
        }
        .name {
            margin-top: 8px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

<h1>Aktywności – obrazki</h1>

<div class="grid">
    {% for item in items %}
        <div class="card">
            {% if item.picture %}
                <img src="{{ item.picture }}" alt="{{ item.activityName }}">
            {% else %}
                <div>Brak obrazka</div>
            {% endif %}
            <div class="name">{{ item.activityName }}</div>
        </div>
    {% endfor %}
</div>

</body>
</html>
