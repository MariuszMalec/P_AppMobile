<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LIVE TERAZ</title>

<style>
:root {
    --bg: #020210;
    --panel: #0c0f2a;
    --text: #ffffff;
    --muted: #8c8cb8;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #0a0d3a, #020210);
    color: var(--text);
    font-family: system-ui, sans-serif;
}

/* POWRÓT */
.back {
    padding: 14px 16px 0;
}

.back a {
    color: #38bdf8;
    text-decoration: none;
    font-weight: 600;
}

/* HEADER */
.header {
    text-align: center;
    padding: 12px 8px 20px;
}

.header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    padding: 16px;
}

/* TILE */
.tile {
    position: relative;
    height: 220px;
    border-radius: 18px;
    overflow: hidden;
    background: var(--panel);
    animation: livePulse 2s ease-in-out infinite;
}

/* IMAGE */
.tile img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* OVERLAY */
.tile-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px;
    background: linear-gradient(
        to top,
        rgba(0,0,0,.8),
        rgba(0,0,0,.4),
        rgba(0,0,0,.8)
    );
}

.person {
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 6px;
}

.desc {
    font-size: 22px;
    font-weight: 700;
}

/* PULSE — BEZ RAMKI (ANDROID SAFE) */
@keyframes livePulse {
    0%   { filter: brightness(1) saturate(1); }
    50%  { filter: brightness(1.6) saturate(1.8); }
    100% { filter: brightness(1) saturate(1); }
}

/* EMPTY */
.empty {
    text-align: center;
    color: var(--muted);
    font-size: 20px;
    padding: 80px 16px;
}

/* TV */
@media (min-width: 1200px) {
    .tile { height: 260px; }
    .desc { font-size: 26px; }
}
</style>
</head>

<body>

<div class="back">
    <a href="/">⬅ Powrót</a>
</div>

<div class="header">
    <h1>🟢 LIVE TERAZ</h1>
</div>

{% if live_items %}
<div class="grid">
    {% for item in live_items %}
    <div class="tile">
        {% if item.picture %}
            <img src="{{ item.picture }}">
        {% endif %}
        <div class="tile-overlay">
            <div class="person">👤 {{ item.person }}</div>
            <div class="desc">{{ item.description }}</div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="empty">
    Brak aktywnych zajęć LIVE
</div>
{% endif %}

<script>
(function () {
    const REFRESH_MS = 30000;
    setInterval(() => {
        if (!document.hidden) {
            location.reload();
        }
    }, REFRESH_MS);
})();
</script>

</body>
</html>
