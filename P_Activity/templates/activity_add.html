<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dodaj aktywność</title>
</head>
<body>

<h2>Dodaj aktywność</h2>

<form method="post" action="/activities/add">

    <label>Osoba</label>
    <select name="person_id" required>
        {% for id, name in persons.items() %}
            <option value="{{ id }}">{{ name }}</option>
        {% endfor %}
    </select>

    <br><br>

    <label>Aktywność</label>
    <select name="picture_id" required>
        {% for id, name in activities.items() %}
            <option value="{{ id }}">{{ name }}</option>
        {% endfor %}
    </select>

    <br><br>

    <label>Dzień tygodnia</label>
    <select name="day_of_week" required>
        {% for key, label in days.items() %}
            <option value="{{ key }}">{{ label }}</option>
        {% endfor %}
    </select>

    <br><br>

    <label>Start</label>
    <input type="datetime-local" name="start" required>

    <br><br>

    <label>Koniec</label>
    <input type="datetime-local" name="end" required>

    <br><br>

    <label>Opis</label>
    <textarea name="description"></textarea>

    <br><br>

    <button type="submit">Zapisz</button>

</form>

</body>
</html>
