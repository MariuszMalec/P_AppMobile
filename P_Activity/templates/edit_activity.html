<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Edytuj aktywność</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        .container {
            max-width: 520px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        form {
            display: grid;
            gap: 16px;
        }

        label {
            font-weight: 600;
            font-size: .9em;
            margin-bottom: 4px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        input, select, textarea {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            font-size: 1em;
        }

        textarea {
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .preview {
            text-align: center;
        }

        .preview img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 10px;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .save {
            background: #22c55e;
            color: white;
        }

        .cancel {
            background: #e5e7eb;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>✏️ Edytuj aktywność</h1>

    <div class="card">
        <form method="post">

            <div class="row">
                <div class="field">
                    <label>Godzina rozpoczęcia</label>
                    <input type="time" name="start"
                           value="{{ activity.StartTime[:5] }}">
                </div>

                <div class="field">
                    <label>Godzina zakończenia</label>
                    <input type="time" name="end"
                           value="{{ activity.EndTime[:5] }}">
                </div>
            </div>

            <div class="field">
                <label>Opis</label>
                <textarea name="description">{{ activity.Description }}</textarea>
            </div>

            <div class="field">
                <label>Osoba</label>
                <select name="person_id">
                    {% for p in persons %}
                        <option value="{{ p.id }}"
                            {% if p.id == activity.ModelPersonFamilyId %}selected{% endif %}>
                            {{ p.label }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label>Aktywność</label>
                <select name="picture_id" id="pictureSelect">
                    {% for pic in pictures %}
                        <option value="{{ pic.id }}"
                                data-img="{{ pic.picture }}"
                                {% if pic.id == activity.ModelPictureActivityId %}selected{% endif %}>
                            {{ pic.label }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="preview">
                <img id="previewImage"
                     src="{% for pic in pictures %}{% if pic.id == activity.ModelPictureActivityId %}{{ pic.picture }}{% endif %}{% endfor %}">
            </div>

            <div class="actions">
                <button class="save">💾 Zapisz zmiany</button>
                <a class="cancel" href="/">↩ Anuluj</a>
            </div>

        </form>
    </div>
</div>

<script>
const select = document.getElementById("pictureSelect");
const img = document.getElementById("previewImage");

select.addEventListener("change", () => {
    const option = select.selectedOptions[0];
    img.src = option.dataset.img || "";
});
</script>

</body>
</html>
