<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Aktywności na żywo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: system-ui, sans-serif;
            background: #f4f6f8;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .activity {
            background: white;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,.08);
        }

        .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .time {
            font-size: 14px;
            color: #555;
        }

        .meta {
            margin-top: 8px;
            font-size: 13px;
            color: #777;
        }

        .empty {
            text-align: center;
            color: #777;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<h1>🔴 Aktywności na żywo</h1>

{% if live_items %}
    {% for item in live_items %}
        <div class="activity">
            <div class="title">
                {{ item[4] }}
            </div>

            <div class="time">
                ⏰ {{ item[2][:5] }} – {{ item[3][:5] }}
            </div>

            <div class="meta">
                📅 Dzień tygodnia: {{ item[5] }} |
                👤 Rodzina: {{ item[6] }}
            </div>
        </div>
    {% endfor %}
{% else %}
    <div class="empty">
        Brak aktywności w tej chwili
    </div>
{% endif %}

</body>
</html>
