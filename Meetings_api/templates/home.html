<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TYDZIEŃ SESJI</title>

<style>
:root {
    --panel: #0c0f2a;
    --border: rgba(255,255,255,.12);
    --text: #ffffff;
    --muted: #8c8cb8;
}

/* =========================================================
   PODSTAWA
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: radial-gradient(circle at top, #0a0d3a, #020210);
    color: var(--text);
    font-family: system-ui, sans-serif;
    overflow-x: hidden;
}

/* =========================================================
   NAGŁÓWEK
   ========================================================= */

.header {
    width: 100%;
    min-height: 70px;
    padding: 10px 12px;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;

    font-size: 18px;
    font-weight: 600;

    flex-wrap: wrap;
}

.header > * {
    flex-shrink: 0;
}

/* =========================================================
   STRZAŁKI TYGODNIA
   ========================================================= */

.week-arrow {
    color: var(--text);
    text-decoration: none;
    font-size: 30px;
    font-weight: 700;
    cursor: pointer;

    width: 46px;
    height: 46px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border: 2px solid rgba(255,255,255,.5);
    border-radius: 12px;
    background: rgba(255,255,255,.06);

    box-sizing: border-box;
    transition: all 0.2s ease;

    flex-shrink: 0;
}

.week-arrow:hover {
    background: rgba(255,255,255,.15);
    border-color: rgba(255,255,255,.9);
    transform: scale(1.05);
}

.week-arrow:active {
    transform: scale(0.95);
}

/* =========================================================
   LIVE CZAS
   ========================================================= */

.live-time {
    font-weight: 400;
    font-size: 14px;
    color: #8cff8c;
    white-space: nowrap;
}

/* =========================================================
   PRZYCISKI
   ========================================================= */

.create-client-btn {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    border: none;
    color: white;

    padding: 8px 14px;
    border-radius: 10px;

    font-size: 14px;
    cursor: pointer;

    transition: all 0.2s ease;
}

.create-client-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0,114,255,.4);
}

.create-client-btn:active {
    transform: scale(0.96);
}

.create-session-btn {
    position: relative;

    background: linear-gradient(135deg, #00ff9f, #00cfff);
    border: none;
    color: #001;

    padding: 8px 14px;
    border-radius: 10px;

    font-size: 14px;
    font-weight: 600;
    cursor: pointer;

    transition: all 0.2s ease;
}

.create-session-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(0,255,200,.35);
}

.create-session-btn:active {
    transform: scale(0.96);
}

.create-session-btn::before {
    content: "";
    position: absolute;
    inset: 0;

    border-radius: 10px;
    background: rgba(255,255,255,0.1);

    opacity: 0;
    transition: 0.2s;
}

.create-session-btn:hover::before {
    opacity: 1;
}

/* =========================================================
   TABELA
   ========================================================= */

.table-wrap {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;

    padding: 8px;

    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
}

/*
   Na komputerze tabela wypełnia ekran.
   Na telefonie dostaje minimalną szerokość,
   dzięki czemu 7 dni nie zostanie ściśniętych
   do kilku pikseli.
*/
table {
    width: 100%;
    min-width: 760px;

    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0;

    background: var(--panel);
    border-radius: 14px;

    overflow: hidden;
}

/* pierwsza kolumna - godzina */
th:first-child,
td:first-child {
    width: 70px;
}

/* kolumny dni */
th:not(:first-child),
td:not(:first-child) {
    min-width: 98px;
}

th,
td {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);

    text-align: center;
    vertical-align: middle;
}

/* =========================================================
   NAGŁÓWKI DNI
   ========================================================= */

th {
    height: 44px;

    font-size: 12px;
    color: var(--muted);

    white-space: nowrap;

    background: var(--panel);
}

th:first-child {
    position: sticky;
    left: 0;
    z-index: 5;

    background: var(--panel);
}

/* =========================================================
   KOMÓRKI SESJI
   ========================================================= */

td {
    height: 80px;

    position: relative;
    cursor: pointer;

    overflow: hidden;
}

td:first-child {
    position: sticky;
    left: 0;
    z-index: 4;

    background: var(--panel);

    font-size: 12px;
    font-weight: 500;
}

/* usuń podwójne obramowania z prawej/dół */
th:last-child,
td:last-child {
    border-right: none;
}

tbody tr:last-child td {
    border-bottom: none;
}

/* =========================================================
   NAKŁADKA SESJI
   ========================================================= */

.tile-overlay {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
    line-height: 1.2;

    padding: 6px;

    background: rgba(0,0,0,.5);

    overflow: hidden;
    text-overflow: ellipsis;
    word-break: break-word;
}

.empty {
    color: #444;
}

/* =========================================================
   LIVE
   ========================================================= */

@keyframes livePulse {
    0% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.6);
    }

    100% {
        filter: brightness(1);
    }
}

.live {
    animation: livePulse 1.5s infinite;
}

/* =========================================================
   POPUP / PREVIEW
   ========================================================= */

.preview-bg {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(0,0,0,.6);

    display: none;
    align-items: center;
    justify-content: center;

    padding: 16px;

    z-index: 1000;

    overflow-y: auto;
}

.preview-bg.active {
    display: flex;
}

.preview-card {
    background: var(--panel);

    padding: 18px;

    border-radius: 14px;

    width: 320px;
    max-width: 100%;

    max-height: calc(100vh - 32px);
    overflow-y: auto;

    box-shadow: 0 15px 50px rgba(0,0,0,.5);
}

/* =========================================================
   POLA FORMULARZA
   ========================================================= */

.preview-card label {
    display: block;

    margin: 7px 0 4px;

    font-size: 13px;
    color: var(--muted);
}

.preview-card input,
.preview-card select {
    display: block;

    width: 100%;
    max-width: 100%;

    min-height: 42px;

    margin: 0 0 8px;

    padding: 8px 10px;

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px;

    background: #080b20;
    color: white;

    font-family: inherit;
    font-size: 15px;

    outline: none;
}

.preview-card input:focus,
.preview-card select:focus {
    border-color: rgba(0,198,255,.7);
}

.preview-card input:disabled,
.preview-card select:disabled {
    opacity: .65;
}

/* =========================================================
   PRZYCISKI POPUP
   ========================================================= */

.preview-card button {
    width: 100%;

    min-height: 44px;

    padding: 10px;

    margin-top: 8px;

    border: none;
    border-radius: 9px;

    background: linear-gradient(135deg, #00c6ff, #0072ff);

    color: white;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    touch-action: manipulation;
}

.preview-card button:hover {
    filter: brightness(1.1);
}

.preview-card button:active {
    transform: scale(.98);
}

/* =========================================================
   TELEFON
   ========================================================= */

@media (max-width: 700px) {

    .header {
        padding: 8px 8px 10px;

        gap: 7px;

        font-size: 15px;

        /*
           Układ:
           ← TYDZIEŃ data czas →
           a pod spodem przyciski
        */
    }

    .week-arrow {
        width: 40px;
        height: 40px;

        font-size: 25px;

        border-radius: 10px;
    }

    .live-time {
        font-size: 12px;
    }

    #current-day-date {
        font-size: 14px;
        white-space: nowrap;
    }

    /*
       Przyciski na telefonie zajmują osobny wiersz.
    */
    .create-session-btn,
    .create-client-btn {
        min-height: 40px;

        padding: 8px 11px;

        font-size: 13px;
    }

    .table-wrap {
        padding: 5px;

        /*
           Daje użytkownikowi wyraźnie możliwość
           przewijania tabeli na boki.
        */
        overflow-x: auto;
    }

    table {
        /*
           70 + 7 * 98 = 756px.
           Dzięki temu dni są nadal czytelne.
        */
        min-width: 756px;
    }

    th:first-child,
    td:first-child {
        width: 60px;
        min-width: 60px;
    }

    th:not(:first-child),
    td:not(:first-child) {
        min-width: 99px;
    }

    th {
        height: 42px;
        font-size: 11px;
    }

    td {
        height: 72px;
    }

    td:first-child {
        font-size: 11px;
    }

    .tile-overlay {
        font-size: 11px;
        padding: 5px;
    }

    /*
       Popup na telefonie prawie na całą szerokość,
       ale z małym marginesem.
    */
    .preview-bg {
        padding: 10px;
        align-items: center;
    }

    .preview-card {
        width: 100%;
        max-width: 430px;

        padding: 16px;

        border-radius: 14px;

        max-height: calc(100vh - 20px);
    }

    .preview-card input,
    .preview-card select {
        min-height: 44px;
        font-size: 16px;
    }

    .preview-card button {
        min-height: 46px;
        font-size: 16px;
    }
}

/* =========================================================
   BARDZO MAŁY TELEFON
   ========================================================= */

@media (max-width: 390px) {

    .header {
        gap: 5px;
        font-size: 14px;
    }

    .week-arrow {
        width: 38px;
        height: 38px;

        font-size: 23px;
    }

    #current-day-date {
        font-size: 13px;
    }

    .live-time {
        font-size: 11px;
    }

    .create-session-btn,
    .create-client-btn {
        padding: 7px 9px;
        font-size: 12px;
    }

    table {
        min-width: 742px;
    }

    th:not(:first-child),
    td:not(:first-child) {
        min-width: 97px;
    }

    .preview-card {
        padding: 14px;
    }
}

/* =========================================================
   LEPSZE DOTYKANIE NA EKRANACH DOTYKOWYCH
   ========================================================= */

@media (hover: none) and (pointer: coarse) {

    td {
        cursor: pointer;
    }

    .week-arrow,
    button {
        touch-action: manipulation;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     NAGŁÓWEK
     ======================================================= -->

<div class="header">

    <a href="?week_offset={{ week_offset - 1 }}"
       class="week-arrow"
       onclick="console.log('KLIK LEWO', new Date().toISOString(), this.href);">
        ⬅
    </a>

    <span>🟢 LIVE — TYDZIEŃ</span>

    <span id="current-day-date"></span>

    <span class="live-time" id="live-time">--:--:--</span>

    <a href="?week_offset={{ week_offset + 1 }}"
       class="week-arrow"
       onclick="console.log('KLIK PRAWO', new Date().toISOString(), this.href);">
        ➡
    </a>

    <button class="create-session-btn"
            onclick="openCreateSession()">
        ➕ Nowa sesja
    </button>

    <button class="create-client-btn"
            onclick="openCreateClient()">
        👤 Nowy klient
    </button>

</div>


<!-- =======================================================
     TABELA
     ======================================================= -->

<div class="table-wrap">

<table>

<thead>

<tr>

    <th>⏰</th>

    {% for d in range(1, 8) %}
        <th class="day-header"
            data-day="{{ d }}">
            {{ days[d] }}
        </th>
    {% endfor %}

</tr>

</thead>


<tbody>

{% for time, day_rows in table.items() %}

<tr>

    <td>{{ time }}</td>

    {% for d in range(1, 8) %}

        {% set cell = day_rows[d] %}

        <td
            class="{% if cell and cell.is_live %}live{% endif %}"

            {% if cell %}

            data-session-id="{{ cell.session_id }}"
            data-client="{{ cell.client or '' }}"
            data-desc="{{ cell.description or '' }}"
            data-start="{{ cell.start or '' }}"
            data-end="{{ cell.end or '' }}"
            data-day="{{ d }}"
            data-session-date="{{ cell.session_date }}"

            onclick="openPreview(this)"

            {% else %}

            data-day="{{ d }}"

            onclick="openCreateSessionForDay({{ d }})"

            {% endif %}
        >

            {% if cell %}

                <div class="tile-overlay">
                    {{ cell.client or 'Brak klienta' }}
                </div>

            {% else %}

                <div class="empty">—</div>

            {% endif %}

        </td>

    {% endfor %}

</tr>

{% endfor %}

</tbody>

</table>

</div>


<!-- =======================================================
     PREVIEW / EDYCJA SESJI
     ======================================================= -->

<div class="preview-bg"
     id="preview"
     onclick="closePreview()">

    <div class="preview-card"
         onclick="event.stopPropagation()">

        <label>Start</label>
        <input type="time" id="p-start">

        <label>Koniec</label>
        <input type="time" id="p-end">

        <label>Klient</label>

        <select id="p-client">

            <option value="">
                — wybierz klienta —
            </option>

            {% for c in clients %}

                <option value="{{ c.Id }}">
                    {{ c.FirstName }} {{ c.LastName }}
                </option>

            {% endfor %}

        </select>


        <label>Opis</label>
        <input type="text" id="p-desc">


        <label>Dzień tygodnia</label>

        <select id="p-day">

            <option value="1">Poniedziałek</option>
            <option value="2">Wtorek</option>
            <option value="3">Środa</option>
            <option value="4">Czwartek</option>
            <option value="5">Piątek</option>
            <option value="6">Sobota</option>
            <option value="7">Niedziela</option>

        </select>


        <button onclick="saveEdit()">
            💾 Zapisz
        </button>

        <button onclick="deleteSession()">
            🗑 Usuń
        </button>

    </div>

</div>


<!-- =======================================================
     CLIENT PREVIEW
     ======================================================= -->

<div class="preview-bg"
     id="client-preview"
     onclick="closeClientPreview()">

    <div class="preview-card"
         onclick="event.stopPropagation()">

        <label>Imię</label>
        <input type="text" id="c-first">


        <label>Nazwisko</label>
        <input type="text" id="c-last">


        <label>Wiek</label>
        <input type="number" id="c-age">


        <label>Telefon</label>
        <input type="text" id="c-phone">


        <label>Płeć</label>

        <select id="c-gender">

            <option value="">
                — wybierz —
            </option>

            <option value="male">
                Mężczyzna
            </option>

            <option value="female">
                Kobieta
            </option>

        </select>


        <label>Opis</label>
        <input type="text" id="c-desc">


        <button onclick="createClient()">
            💾 Utwórz klienta
        </button>

    </div>

</div>


<!-- =======================================================
     JAVASCRIPT
     ======================================================= -->

<script>

let currentCell = null;
let weekOffset = 0;


// =========================================================
// WYŚWIETLANIE LIVE CZASU
// =========================================================

function updateLiveTime() {

    const now = new Date();

    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');

    document.getElementById('live-time').textContent =
        `${h}:${m}:${s}`;
}


// =========================================================
// FUNKCJE PODGLĄDU - EDIT
// =========================================================

function openPreview(el) {

    currentCell = el;

    document.getElementById('p-start').value =
        el.dataset.start;

    document.getElementById('p-end').value =
        el.dataset.end;

    document.getElementById('p-client').value =
        el.dataset.client_id || "";

    document.getElementById('p-desc').value =
        el.dataset.desc;

    document.getElementById('p-day').value =
        el.dataset.day;

    document.getElementById('preview')
        .classList.add('active');


    // Przywracamy przycisk Save dla edycji

    const saveBtn =
        document.querySelector(
            '.preview-card button:first-of-type'
        );

    saveBtn.textContent = "💾 Zapisz";
    saveBtn.onclick = saveEdit;


    // Pokaż przycisk Usuń

    document.querySelector(
        '.preview-card button:last-of-type'
    ).style.display = "block";


    // BLOKUJ pole klienta w edycji

    document.getElementById('p-client').disabled = true;
}


// =========================================================
// FUNKCJA DO ZAŁADOWANIA LISTY KLIENTÓW
// =========================================================

function loadClientList() {

    fetch('/home/get_clients')

        .then(response => response.json())

        .then(clients => {

            const clientSelect =
                document.getElementById('p-client');

            clientSelect.innerHTML =
                '<option value="">— wybierz klienta —</option>';

            clients.forEach(client => {

                const option =
                    document.createElement("option");

                option.value = client.Id;

                option.textContent =
                    `${client.FirstName} ${client.LastName}`;

                clientSelect.appendChild(option);

            });

        })

        .catch(err => {

            console.error(
                "Błąd ładowania klientów: ",
                err
            );

            alert(
                "Nie udało się załadować listy klientów"
            );

        });
}


// =========================================================
// ZAMKNIĘCIE PREVIEW
// =========================================================

function closePreview() {

    document.getElementById('preview')
        .classList.remove('active');
}


// =========================================================
// ZAPIS EDYCJI
// =========================================================

function saveEdit() {

    if (!currentCell) return;

    const id =
        currentCell.dataset.sessionId;

    const formData =
        new FormData();


    formData.append(
        "start",
        document.getElementById('p-start').value
    );

    formData.append(
        "end",
        document.getElementById('p-end').value
    );

    formData.append(
        "description",
        document.getElementById('p-desc').value
    );

    formData.append(
        "day_of_week",
        document.getElementById('p-day').value
    );


    // WAŻNE: dokładna data edytowanej sesji

    formData.append(
        "session_date",
        currentCell.dataset.sessionDate
    );


    console.log("FORMULARZ EDYCJI:");

    for (const [key, value]
         of formData.entries()) {

        console.log(
            key,
            "=",
            value
        );
    }


    fetch(`/home/session/edit/${id}`, {

        method: "PUT",
        body: formData

    })

    .then(async response => {

        const data =
            await response.json();

        if (!response.ok) {

            console.error(
                "BŁĄD SERWERA:",
                data
            );

            throw new Error(
                JSON.stringify(data)
            );
        }

        return data;

    })

    .then(() => {

        location.reload();

    })

    .catch(err => {

        console.error(err);

        alert(
            "Błąd zapisu:\n" +
            err.message
        );

    });
}


// =========================================================
// USUWANIE SESJI
// =========================================================

function deleteSession() {

    if (!currentCell) return;

    const id =
        currentCell.dataset.sessionId;

    if (!confirm("Usunąć sesję?"))
        return;


    fetch(
        `/home/session/delete/${id}`,
        {
            method: "POST"
        }
    )

    .then(r => {

        if (!r.ok)
            throw new Error(
                "Błąd usuwania"
            );

        location.reload();

    })

    .catch(err =>
        alert(err.message)
    );
}


// =========================================================
// UZUPEŁNIANIE DAT PRZY DNIACH TYGODNIA
// =========================================================

function updateWeekDates() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const offset =
        parseInt(
            params.get("week_offset") || "0"
        );


    const now = new Date();

    const dayOfWeek =
        now.getDay();

    const mondayOffset =
        dayOfWeek === 0
            ? -6
            : 1 - dayOfWeek;


    const weekStart =
        new Date(now);

    weekStart.setDate(
        now.getDate() +
        mondayOffset +
        offset * 7
    );


    const headers =
        document.querySelectorAll(
            '.day-header'
        );


    headers.forEach((th, index) => {

        const d =
            new Date(weekStart);

        d.setDate(
            d.getDate() + index
        );


        const dayNum =
            String(
                d.getDate()
            ).padStart(2, '0');

        const monthNum =
            String(
                d.getMonth() + 1
            ).padStart(2, '0');


        const baseName =
            th.textContent
              .split(' ')[0];


        th.textContent =
            `${baseName} (${dayNum}.${monthNum})`;

    });


    document.getElementById(
        'current-day-date'
    ).textContent =
        weekStart.toLocaleDateString(
            'pl-PL'
        );
}


// =========================================================
// FILTROWANIE SESJI WG TYGODNIA
// =========================================================

function filterSessionsByWeek(start, end) {

    function toLocalDateStr(d) {

        const year =
            d.getFullYear();

        const month =
            String(
                d.getMonth() + 1
            ).padStart(2, '0');

        const day =
            String(
                d.getDate()
            ).padStart(2, '0');

        return `${year}-${month}-${day}`;
    }


    const startStr =
        toLocalDateStr(start);

    const endStr =
        toLocalDateStr(end);


    document
        .querySelectorAll("tbody tr")
        .forEach(tr => {

            let hasVisibleSession =
                false;


            tr.querySelectorAll(
                'td[data-session-id]'
            ).forEach(td => {

                const dateStr =
                    td.dataset.sessionDate;

                if (!dateStr)
                    return;


                if (
                    dateStr < startStr ||
                    dateStr > endStr
                ) {

                    td.style.display =
                        "none";

                } else {

                    td.style.display =
                        "";

                    hasVisibleSession =
                        true;
                }

            });


            tr.style.display =
                hasVisibleSession

// =========================================================
// TWORZENIE SESJI
// =========================================================

function createSession() {

    const startTime =
        document.getElementById(
            'p-start'
        ).value;


    const endTime =
        document.getElementById(
            'p-end'
        ).value;


    const clientId =
        document.getElementById(
            'p-client'
        ).value;


    const description =
        document.getElementById(
            'p-desc'
        ).value;


    const dayOfWeek =
        parseInt(
            document.getElementById(
                'p-day'
            ).value,
            10
        );


    // Data bazowa ustalona podczas otwarcia formularza.

    const baseDate =
        document.getElementById(
            'preview'
        ).dataset.sessionDate;


    if (!baseDate) {

        alert(
            "Nie wybrano dnia sesji"
        );

        return;
    }


    if (
        !dayOfWeek ||
        dayOfWeek < 1 ||
        dayOfWeek > 7
    ) {

        alert(
            "Nieprawidłowy dzień tygodnia"
        );

        return;
    }


    // ==========================================
    // WYLICZ SessionDate NA PODSTAWIE p-day
    // ==========================================

    const date =
        new Date(
            baseDate +
            "T12:00:00"
        );


    const jsDay =
        date.getDay();


    const mondayOffset =
        jsDay === 0
            ? -6
            : 1 - jsDay;


    date.setDate(
        date.getDate() +
        mondayOffset +
        (dayOfWeek - 1)
    );


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            date.getDate()
        ).padStart(2, "0");


    const sessionDate =
        `${year}-${month}-${day}`;


    // ==========================================
    // FORM DATA
    // ==========================================

    const formData =
        new FormData();


    formData.append(
        "start",
        startTime
    );


    formData.append(
        "end",
        endTime
    );


    formData.append(
        "client_id",
        clientId
    );


    formData.append(
        "description",
        description
    );


    formData.append(
        "day_of_week",
        dayOfWeek
    );


    formData.append(
        "session_date",
        sessionDate
    );


    console.log(
        "TWORZENIE SESJI:"
    );

    console.log(
        "start =",
        startTime
    );

    console.log(
        "end =",
        endTime
    );

    console.log(
        "day_of_week =",
        dayOfWeek
    );

    console.log(
        "session_date =",
        sessionDate
    );


    fetch(
        "/home/session/create",
        {
            method: "POST",
            body: formData
        }
    )

    .then(async response => {

        const data =
            await response.json();


        if (!response.ok) {

            console.error(
                "BŁĄD TWORZENIA:",
                data
            );


            throw new Error(
                data.detail ||
                "Błąd tworzenia sesji"
            );
        }


        return data;

    })

    .then(() => {

        location.reload();

    })

    .catch(err => {

        console.error(err);

        alert(
            "Błąd: " +
            err.message
        );

    });
}

function openCreateSessionForDay(dayOfWeek) {

        new URLSearchParams(

        );

        parseInt(
            params.get("week_offset") || "0"
        );


    // Dzisiejsza data

    const today =
        new Date();


    // Ustalamy poniedziałek bieżącego tygodnia

    const currentDay =
        today.getDay();


    const mondayOffset =
        currentDay === 0
            ? -6
            : 1 - currentDay;


    const monday =
        new Date(today);


    monday.setHours(
        12,
        0,
        0,
        0
    );


    monday.setDate(
        today.getDate() +
        mondayOffset
    );


    // Przesuwamy do tygodnia wyświetlanego na ekranie

    monday.setDate(
        monday.getDate() +
        weekOffset * 7
    );


    // Ustalamy konkretną datę klikniętego dnia

    const sessionDate =
        new Date(monday);


    sessionDate.setDate(
        monday.getDate() +

    );

    const month =

        ).padStart(2, "0");

        ).padStart(2, "0");

    );

    );

    ).value = "";


    document.getElementById(
        'p-client'
    ).value = "";

        'p-desc'
    ).value = "";

    ).value =

    // Zapamiętujemy wybraną datę

    document.getElementById(
        'preview'

    document.getElementById(
        'preview'
    ).classList.add('active');


    // Przycisk Zapisz -> Utwórz
