<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Meetings</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #dfe7f1);
            color: #1f2937;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 34px;
            font-weight: 700;
            color: #172033;
        }

        .header p {
            margin: 0;
            font-size: 16px;
            color: #64748b;
        }

        .menu {
            display: grid;
            gap: 18px;
        }

        .menu-button {
            display: flex;
            align-items: center;
            gap: 18px;

            width: 100%;
            min-height: 110px;

            padding: 22px 24px;

            background: white;
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 20px;

            text-decoration: none;
            color: inherit;

            box-shadow:
                0 8px 25px rgba(15, 23, 42, 0.08);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .menu-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 14px 30px rgba(15, 23, 42, 0.13);
        }

        .menu-button:active {
            transform: scale(0.98);
        }

        .icon {
            width: 64px;
            height: 64px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            font-size: 32px;
        }

        .clients-icon {
            background: #e0f2fe;
        }

        .sessions-icon {
            background: #ede9fe;
        }

        .button-content {
            flex: 1;
        }

        .button-title {
            margin-bottom: 5px;

            font-size: 21px;
            font-weight: 700;
            color: #172033;
        }

        .button-description {
            font-size: 14px;
            line-height: 1.4;
            color: #64748b;
        }

        .arrow {
            font-size: 26px;
            color: #94a3b8;
        }

        .footer {
            margin-top: 28px;

            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }

        @media (max-width: 480px) {

            body {
                padding: 16px;
            }

            .header h1 {
                font-size: 30px;
            }

            .menu-button {
                min-height: 100px;
                padding: 18px;
            }

            .icon {
                width: 56px;
                height: 56px;
                font-size: 28px;
            }

            .button-title {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Meetings</h1>
        <p>Wybierz sekcję</p>
    </div>

    <div class="menu">

        <a href="/clients/" class="menu-button">
            <div class="icon clients-icon">
                👥
            </div>

            <div class="button-content">
                <div class="button-title">
                    Klienci
                </div>

                <div class="button-description">
                    Zarządzanie listą klientów
                </div>
            </div>

            <div class="arrow">
                ›
            </div>
        </a>


        <a href="/sessions/" class="menu-button">
            <div class="icon sessions-icon">
                📅
            </div>

            <div class="button-content">
                <div class="button-title">
                    Sesje
                </div>

                <div class="button-description">
                    Harmonogram i zarządzanie sesjami
                </div>
            </div>

            <div class="arrow">
                ›
            </div>
        </a>

    </div>

    <div class="footer">
        Meetings
    </div>

</div>

</body>
</html>
