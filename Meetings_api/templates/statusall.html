<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TYDZIEŃ SESJI</title>
<style>
:root {
    --panel: #0c0f2a;
    --border: rgba(255,255,255,.12);
    --text: #ffffff;
    --muted: #8c8cb8;
}

body {
    margin: 0;
    background: radial-gradient(circle at top, #0a0d3a, #020210);
    color: var(--text);
    font-family: system-ui, sans-serif;
}

.header {
    text-align: center;
    padding: 12px;
    font-weight: 600;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    font-size: 18px;
}

.header button {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
}

.table-wrap {
    overflow-x: auto;
    padding: 8px;
}

table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    background: var(--panel);
    border-radius: 14px;
}

th, td {
    border: 1px solid var(--border);
    text-align: center;
}

th {
    height: 44px;
    font-size: 12px;
    color: var(--muted);
}

td {
    height: 80px;
    position: relative;
    cursor: pointer;
}

.tile-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    padding: 6px;
    background: rgba(0,0,0,.5);
}

.empty {
    color: #444;
}

@keyframes livePulse {
    0% { filter: brightness(1); }
    50% { filter: brightness(1.6); }
    100% { filter: brightness(1); }
}

.live {
    animation: livePulse 1.5s infinite;
}

/* PREVIEW */
.preview-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    display: none;
    align-items: center;
    justify-content: center;
}

.preview-bg.active {
    display: flex;
}

.preview-card {
    background: var(--panel);
    padding: 16px;
    border-radius: 14px;
    width: 320px;
}

.preview-card input,
.preview-card select {
    width: 100%;
    margin-bottom: 8px;
}

.preview-card button {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
}

.live-time {
    font-weight: 400;
    font-size: 14px;
    color: #8cff8c;
}

.create-client-btn {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.create-client-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0,114,255,.4);
}

.create-client-btn:active {
    transform: scale(0.96);
}

.create-session-btn {
    background: linear-gradient(135deg, #00ff9f, #00cfff);
    border: none;
    color: #001;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}

.create-session-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(0,255,200,.35);
}

.create-session-btn:active {
    transform: scale(0.96);
}

.create-session-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    opacity: 0;
    transition: 0.2s;
}

.create-session-btn:hover::before {
    opacity: 1;
}


</style>
</head>
<body>

<div class="header">
    <button onclick="changeWeek(-1)">⬅</button>
    🟢 LIVE — TYDZIEŃ 
    <span id="current-day-date"></span>
    <span class="live-time" id="live-time">--:--:--</span>
    <button onclick="changeWeek(1)">➡</button>
    <button class="create-session-btn" onclick="openCreateSession()">
        ➕ Nowa sesja
    </button>
    <button class="create-client-btn" onclick="openCreateClient()">👤 Nowy klient</button>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
    <th>⏰</th>
    {% for d in range(1, 8) %}
        <th class="day-header" data-day="{{ d }}">{{ days[d] }}</th>
    {% endfor %}
</tr>
</thead>
<tbody>
{% for time, day_rows in table.items() %}
<tr>
    <td>{{ time }}</td>
    {% for d in range(1, 8) %}
        {% set cell = day_rows[d] %}
        <td class="{% if cell and cell.is_live %}live{% endif %}"
            {% if cell %}
            data-session-id="{{ cell.session_id }}"
            data-client="{{ cell.client or '' }}"
            data-desc="{{ cell.description or '' }}"
            data-start="{{ cell.start or '' }}"
            data-end="{{ cell.end or '' }}"
            data-day="{{ d }}"
            data-session-date="{{ cell.session_date }}"
            onclick="openPreview(this)"
            {% endif %}
        >
            {% if cell %}
                <div class="tile-overlay">
                    {{ cell.client or 'Brak klienta' }}
                </div>
            {% else %}
                <div class="empty">—</div>
            {% endif %}
        </td>
    {% endfor %}
</tr>
{% endfor %}
</tbody>
</table>
</div>

<!-- PREVIEW -->
<div class="preview-bg" id="preview" onclick="closePreview()">
    <div class="preview-card" onclick="event.stopPropagation()">
        <label>Start</label>
        <input type="time" id="p-start">

        <label>Koniec</label>
        <input type="time" id="p-end">

        <label>Klient</label>
        <select id="p-client">
            <option value="">— wybierz klienta —</option>
            {% for c in clients %}
                <option value="{{ c.Id }}">{{ c.FirstName }} {{ c.LastName }}</option>
            {% endfor %}
        </select>

        <label>Opis</label>
        <input type="text" id="p-desc">        

        <label>Dzień tygodnia</label>
        <select id="p-day">
            <option value="1">Poniedziałek</option>
            <option value="2">Wtorek</option>
            <option value="3">Środa</option>
            <option value="4">Czwartek</option>
            <option value="5">Piątek</option>
            <option value="6">Sobota</option>
            <option value="7">Niedziela</option>
        </select>

        <button onclick="saveEdit()">💾 Zapisz</button>
        <button onclick="deleteSession()">🗑 Usuń</button>
    </div>
</div>

<!-- CLIENT PREVIEW -->
<div class="preview-bg" id="client-preview" onclick="closeClientPreview()">
    <div class="preview-card" onclick="event.stopPropagation()">

        <label>Imię</label>
        <input type="text" id="c-first">

        <label>Nazwisko</label>
        <input type="text" id="c-last">

        <label>Wiek</label>
        <input type="number" id="c-age">

        <label>Telefon</label>
        <input type="text" id="c-phone">

        <label>Płeć</label>
        <select id="c-gender">
            <option value="">— wybierz —</option>
            <option value="male">Mężczyzna</option>
            <option value="female">Kobieta</option>
        </select>

        <label>Opis</label>
        <input type="text" id="c-desc">

        <button onclick="createClient()">💾 Utwórz klienta</button>
    </div>
</div>

<!-- Zmieniamy tylko JS -->
<script>
let currentCell = null;
let weekOffset = 0;

// Wyświetlanie live czasu
function updateLiveTime() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('live-time').textContent = `${h}:${m}:${s}`;
}


// Funkcje podglądu - EDIT
function openPreview(el) {
    currentCell = el;
    document.getElementById('p-start').value = el.dataset.start;
    document.getElementById('p-end').value = el.dataset.end;
    document.getElementById('p-client').value = el.dataset.client_id || ""; // ID klienta z dataset
    document.getElementById('p-desc').value = el.dataset.desc;
    document.getElementById('p-day').value = el.dataset.day;
    document.getElementById('preview').classList.add('active');

    // Przywracamy przycisk Save dla edycji
    const saveBtn = document.querySelector('.preview-card button:first-of-type');
    saveBtn.textContent = "💾 Zapisz";
    saveBtn.onclick = saveEdit;

    // Pokaż przycisk Usuń
    document.querySelector('.preview-card button:last-of-type').style.display = "block";

    // BLOKUJ pole klienta w edycji
    document.getElementById('p-client').disabled = true;
}

// Funkcja do załadowania listy klientów
function loadClientList() {
    fetch('/home/get_clients')
        .then(response => response.json())
        .then(clients => {
            const clientSelect = document.getElementById('p-client');
            clientSelect.innerHTML = '<option value="">— wybierz klienta —</option>';  // Resetujemy listę

            // Tworzymy opcje na podstawie pobranych danych
            clients.forEach(client => {
                const option = document.createElement("option");
                option.value = client.Id;
                option.textContent = `${client.FirstName} ${client.LastName}`;
                clientSelect.appendChild(option);
            });
        })
        .catch(err => {
            console.error("Błąd ładowania klientów: ", err);
            alert("Nie udało się załadować listy klientów");
        });
}

// Funkcja otwierająca formularz "Nowa sesja"
function openCreateSession() {
    currentCell = null; // Brak wybranej sesji
    document.getElementById('p-start').value = "";
    document.getElementById('p-end').value = "";
    document.getElementById('p-client').value = "";
    document.getElementById('p-desc').value = "";
    document.getElementById('p-day').value = "1";
    document.getElementById('preview').classList.add('active');

    // Zmieniamy przycisk save na create
    const saveBtn = document.querySelector('.preview-card button:first-of-type');
    saveBtn.textContent = "💾 Utwórz";
    saveBtn.onclick = createSession;

    // Ukrywamy przycisk Usuń w trybie tworzenia
    document.querySelector('.preview-card button:last-of-type').style.display = "none";

    // Aktywujemy pole klienta
    document.getElementById('p-client').disabled = false;

    // Załaduj listę klientów
    loadClientList();
}

function closePreview() {
    document.getElementById('preview').classList.remove('active');
}

function saveEdit() {
    if (!currentCell) return;
    const id = currentCell.dataset.sessionId;
    const formData = new FormData();
    formData.append("start", document.getElementById('p-start').value);
    formData.append("end", document.getElementById('p-end').value);
    formData.append("client", document.getElementById('p-client').value);
    formData.append("description", document.getElementById('p-desc').value);
    formData.append("day_of_week", document.getElementById('p-day').value);

    fetch(`/home/session/edit/${id}`, {
        method: "PUT",
        body: formData
    })
    .then(r => {
        if (!r.ok) throw new Error("Błąd zapisu");
        location.reload();
    })
    .catch(err => alert(err.message));
}

function deleteSession() {
    if (!currentCell) return;
    const id = currentCell.dataset.sessionId;
    if (!confirm("Usunąć sesję?")) return;

    fetch(`/home/session/delete/${id}`, { method: "POST" })
    .then(r => {
        if (!r.ok) throw new Error("Błąd usuwania");
        location.reload();
    })
    .catch(err => alert(err.message));
}

// Funkcja uzupełniająca daty przy dniach tygodnia z przesunięciem
function updateWeekDates() {
    const now = new Date();
    const dayOfWeek = now.getDay();
    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;

    const headers = document.querySelectorAll('.day-header');
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() + mondayOffset + weekOffset * 7);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);

    headers.forEach((th, index) => {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + index);
        const dayNum = d.getDate();
        const monthNum = String(d.getMonth() + 1).padStart(2, '0');
        const dayName = th.textContent.split(' ')[0];
        th.textContent = `${dayName} (${dayNum}.${monthNum})`;
    });

    const monthNames = ["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"];
    document.getElementById('current-day-date').textContent = `(Poniedziałek ${weekStart.getDate()} ${monthNames[weekStart.getMonth()]})`;

    filterSessionsByWeek(weekStart, weekEnd);
}

// 🔥 Nie nadpisujemy HTML, tylko ukrywamy/odkrywamy komórki
function filterSessionsByWeek(start, end) {
    const startStr = start.toISOString().slice(0,10);
    const endStr = end.toISOString().slice(0,10);

    document.querySelectorAll('td[data-session-id]').forEach(td => {
        const dateStr = td.dataset.sessionDate; // YYYY-MM-DD
        if (!dateStr) return;

        if (dateStr < startStr || dateStr > endStr) {
            td.style.display = "none";
        } else {
            td.style.display = "";
        }
    });
}

function changeWeek(delta) {
    weekOffset += delta;
    updateWeekDates();
}

// NEW: otwieramy popup w trybie create
function openCreateSession() {
    currentCell = null; // brak wybranej sesji
    document.getElementById('p-start').value = "";
    document.getElementById('p-end').value = "";
    document.getElementById('p-client').value = "";
    document.getElementById('p-desc').value = "";
    document.getElementById('p-day').value = "1";
    document.getElementById('preview').classList.add('active');

    // Zmieniamy przycisk save na create
    const saveBtn = document.querySelector('.preview-card button:first-of-type');
    saveBtn.textContent = "💾 Utwórz";
    saveBtn.onclick = createSession;
}

// NEW: funkcja tworzenia sesji
function createSession() {
    const formData = new FormData();
    formData.append("start", document.getElementById('p-start').value);
    formData.append("end", document.getElementById('p-end').value);
    formData.append("client_id", document.getElementById('p-client').value); // podaj ID klienta
    formData.append("description", document.getElementById('p-desc').value);
    formData.append("day_of_week", document.getElementById('p-day').value);
    // automatycznie ustawiamy SessionDate na datę wybranego dnia w bieżącym tygodniu
    const dayOffset = parseInt(document.getElementById('p-day').value) - 1;
    const monday = new Date();
    monday.setDate(monday.getDate() - (monday.getDay() === 0 ? 6 : monday.getDay() - 1)); // start tygodnia
    const sessionDate = new Date(monday);
    sessionDate.setDate(sessionDate.getDate() + dayOffset);
    formData.append("session_date", sessionDate.toISOString().slice(0,10));

    fetch("/home/session/create", {
        method: "POST",
        body: formData
    })
    .then(r => {
        if (!r.ok) throw new Error("Błąd tworzenia sesji");
        location.reload();
    })
    .catch(err => alert(err.message));
}

function openCreateClient() {
    document.getElementById('client-preview').classList.add('active');
}

function createClient() {
    const formData = new FormData();
    formData.append("first_name", document.getElementById('c-first').value);
    formData.append("last_name", document.getElementById('c-last').value);
    formData.append("age", document.getElementById('c-age').value);
    formData.append("phone", document.getElementById('c-phone').value);
    formData.append("description", document.getElementById('c-desc').value);
    formData.append("gender", document.getElementById('c-gender').value);

    fetch("/home/client/create", {
        method: "POST",
        body: formData
    })
    .then(r => {
        if (!r.ok) throw new Error("Błąd tworzenia klienta");
        return r.json();
    })
    .then(() => location.reload())
    .catch(err => alert(err.message));
}

function closeClientPreview() {
    document.getElementById('client-preview').classList.remove('active');
}

// wywołania startowe
setInterval(updateLiveTime, 1000);
updateLiveTime();
updateWeekDates();
</script>

</body>
</html>
