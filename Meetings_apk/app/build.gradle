plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.example.androidtest'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId 'com.example.meetings'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            python.srcDirs = [
                "src/main/python"
            ]
        }
    }

    signingConfigs {
        release {
            storeFile file('../meetings-release.jks')
            storePassword 'Alicja@@13!!!'
            keyAlias 'meetings'
            keyPassword 'Alicja@@13!!!'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

def meetingsApiDir = file("../../Meetings_api")
def apkPythonDir = file("src/main/python")

tasks.register("copyMeetingsApiPython") {
    doLast {
        println "========================================"
        println "KOPIOWANIE Meetings_api -> APK Python"
        println "Źródło:  ${meetingsApiDir}"
        println "Cel:     ${apkPythonDir}"
        println "========================================"

        copy {
            from meetingsApiDir
            into apkPythonDir

            include "main.py"
            include "db.py"
            include "templates.py"
            include "validators.py"
            include "routers/**"
            include "templates/**"
        }
    }
}

tasks.configureEach {
    if (name == "generateDebugPythonSourceAssets" ||
        name == "generateReleasePythonSourceAssets") {
        dependsOn("copyMeetingsApiPython")
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"

        pip {
            install "fastapi==0.109.2"
            install "uvicorn==0.42.0"
            install "jinja2==3.1.6"
            install "python-multipart==0.0.32"
        }
    }
}
