plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.example.androidtest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.meetings'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            storeFile file('../meetings-release.jks')
            storePassword 'Alicja@@13!!!'
            keyAlias 'meetings'
            keyPassword 'Alicja@@13!!!'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"

        pip {
            install "fastapi==0.109.2"
            install "uvicorn==0.42.0"
            install "jinja2==3.1.6"
            install "python-multipart==0.0.32"
        }
    }
}
